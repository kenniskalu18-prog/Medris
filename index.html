<style>
  :root {
    --brand-grad: linear-gradient(135deg, #14a894, #075c52);
    --primary: #000000;
    --primary-light: #5f5e5e;
    --primary-grad: linear-gradient(135deg, #000000, #5f5e5e 60%, #c8c6c5);
    --bg: #f8f9fa;
    --bg-wash: transparent;
    --card: #ffffff;
    --text: #191c1d;
    --text-muted: #444748;
    --border: #e1e3e4;
    --input-bg: #ffffff;
    --danger: #ba1a1a;
    --warning: #f59e0b;
    --success: #16a34a;
    --info: #3b82f6;
    --glass-bg: rgba(255,255,255,0.72);
    --glass-border: rgba(255,255,255,0.4);
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-float: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --primary: #ffffff;
    --primary-light: #c8c6c5;
    --primary-grad: linear-gradient(135deg, #ffffff, #c8c6c5 60%, #5f5e5e);
    --bg: #151c27;
    --bg-wash: transparent;
    --card: #1c1b1b;
    --text: #ffffff;
    --text-muted: #858383;
    --border: #444748;
    --input-bg: #1c1b1b;
    --glass-bg: rgba(21, 28, 39, 0.65);
    --glass-border: rgba(255,255,255,0.08);
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-float: 0 12px 28px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    color-scheme: dark;
  }
  
  body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); }
  .ambient-shadow { box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08); }
  .hover-lift { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.12); }
  
  @keyframes pulse-accent {
      0%, 100% { filter: brightness(0) invert(1) drop-shadow(0 0 5px color-mix(in srgb, var(--primary) 45%, transparent)); transform: scale(1); }
      50% { filter: brightness(0) invert(1) drop-shadow(0 0 15px color-mix(in srgb, var(--primary-light) 80%, transparent)); transform: scale(1.05); }
  }
  .pulse-icon { animation: pulse-accent 3s ease-in-out infinite; }
  .brand-logo-layer { width: auto; height: 2rem; object-fit: contain; }

  .chip-scroll::-webkit-scrollbar { display: none; }
  .chip-scroll { -ms-overflow-style: none; scrollbar-width: none; }

  /* Generic App Styles from Previous Version */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { width: 100%; max-width: 100%; overflow-x: hidden; overscroll-behavior-x: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .spinner { width: 2.4rem; height: 2.4rem; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  #splashScreen { position: fixed; inset: 0; z-index: 999; background: var(--bg); display: flex; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
  #splashScreen.splash-hide { opacity: 0; pointer-events: none; }
  #splashScreen.splash-gone { display: none; }
  .splash-stack { position: relative; width: min(60vw, 320px); aspect-ratio: 788 / 200; display:flex; justify-content:center; align-items:center; }
  .splash-circle { height: 4rem; animation: splashCirclePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards, pulse-accent 3s ease-in-out 0.7s infinite; }
  @keyframes splashCirclePop { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }

  .container { max-width: 1280px; margin: 0 auto; padding: 0 16px; flex: 1; width: 100%; overflow-x: hidden; }
  @media(min-width: 768px) { .container { padding: 0 64px; } }
  
  /* Buttons & Inputs */
  .btn { padding: 0.5rem 1.2rem; border: none; border-radius: 9999px; background: var(--primary); color: var(--bg); cursor: pointer; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; transition: filter 0.15s, transform 0.1s; }
  .btn:hover { background: var(--inverse-surface, #2e3132); }
  .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
  .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.85rem; }
  .btn-danger { background: var(--danger); color: white; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 0.6rem; color: var(--text); }
  input, select, textarea { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 0.5rem; margin: 0.3rem 0 0.5rem; font-size: 1rem; font-family: inherit; background: var(--input-bg); color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 20%, transparent); }
  
  .card { background: var(--card); padding: 1.5rem; border-radius: 1rem; box-shadow: var(--shadow-float); margin-bottom: 1.5rem; border: 1px solid var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
  .flex { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .badge { padding: 0.2rem 0.6rem; border-radius: 0.25rem; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; background: var(--surface-container-highest); color: var(--text); }
  .badge.success { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
  .badge.warning { background: color-mix(in srgb, var(--warning) 20%, transparent); color: var(--warning); }
  .badge.danger { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  
  .hidden { display: none !important; }
  .muted { color: var(--text-muted); font-size: 0.9rem; }
  .error-text { color: var(--danger); font-size: 0.85rem; margin: 0.3rem 0; }
  
  /* Modals & Drawers */
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 250; padding: 1rem; overflow-y: auto; backdrop-filter: blur(5px); }
  .modal-content { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); color: var(--text); padding: 2rem; border-radius: 1rem; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
  
  .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 190; opacity: 0; pointer-events: none; transition: opacity 0.28s ease; }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .side-drawer { position: fixed; top: 0; bottom: 0; width: min(320px, 86vw); z-index: 200; background: var(--glass-bg); backdrop-filter: blur(24px); box-shadow: 0 0 46px rgba(0,0,0,0.35); padding: calc(1.1rem + env(safe-area-inset-top, 0px)) 1rem calc(1.1rem + env(safe-area-inset-bottom, 0px)); overflow-y: auto; color: var(--text); transition: transform 0.32s cubic-bezier(.22,1,.36,1); }
  .side-drawer:not(.open) { pointer-events: none; }
  .side-drawer.right { right: 0; border-left: 1px solid var(--glass-border); transform: translateX(105%); }
  .side-drawer.right.open { transform: translateX(0); }
  .side-drawer.left { left: 0; border-right: 1px solid var(--glass-border); transform: translateX(-105%); }
  .side-drawer.left.open { transform: translateX(0); }
  
  .toast-stack { position: fixed; bottom: calc(5.3rem + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 0.6rem; align-items: center; width: min(420px, 92vw); pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 0.6rem; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); color: var(--text); padding: 0.8rem 1.1rem; border-radius: 0.8rem; box-shadow: 0 12px 30px rgba(0,0,0,0.25); font-size: 0.88rem; opacity: 0; transform: translateY(16px); transition: opacity 0.25s ease, transform 0.25s ease; width: 100%; }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* Mobile Bottom Nav Pill */
  .bottom-nav { display: none; }
  @media (max-width: 767px) {
    body { padding-bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); }
    .bottom-nav { display: flex; position: fixed; left: 1rem; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 80; align-items: center; justify-content: space-around; background: rgba(255,255,255,0.85); backdrop-filter: blur(28px); border: 1px solid rgba(255,255,255,0.3); border-radius: 9999px; padding: 0.6rem 0.5rem; box-shadow: 0 12px 38px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.05); transition: transform 0.25s ease; }
    .dark .bottom-nav { background: rgba(30,30,30,0.85); border-color: rgba(255,255,255,0.1); }
    .bottom-nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; color: var(--text-muted); font-size: 0.65rem; font-family: inherit; font-weight: 500; cursor: pointer; padding: 0.3rem 0.5rem; flex: 1; transition: transform 0.15s ease, color 0.2s; }
    .bottom-nav-item i { font-size: 1.25rem; margin-bottom: 0.1rem; }
    .bottom-nav-item.active { color: var(--primary); }
    .bottom-nav-item.active i { background: var(--surface-container-highest); border-radius: 0.5rem; padding: 0.2rem 0.8rem; margin: -0.2rem -0.8rem 0.1rem; }
  }

  /* AI Chat Fab */
  .ai-chat-fab { position: fixed; right: 1.5rem; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); width: 3.5rem; height: 3.5rem; border-radius: 50%; background: #0453cd; color: white; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-float); cursor: grab; z-index: 150; animation: pulse-accent 3s ease-in-out infinite; }
  @media (max-width: 767px) { .ai-chat-fab { bottom: calc(6rem + env(safe-area-inset-bottom, 0px)) !important; } }
  .ai-chat-fab-logo { width: 1.8rem; height: auto; filter: brightness(0) invert(1); }
  .ai-chat-panel { position: fixed; right: 1.5rem; bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px)); width: min(360px, 90vw); height: min(500px, 68vh); background: var(--glass-bg); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,0.3); z-index: 150; display: flex; flex-direction: column; padding: 1rem; color: var(--text); }
  .ai-chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; margin: 0.5rem 0; }
  .ai-chat-msg { max-width: 85%; padding: 0.7rem 0.9rem; border-radius: 1rem; font-size: 0.9rem; line-height: 1.4; }
  .ai-chat-msg.user { align-self: flex-end; background: var(--primary); color: var(--bg); border-bottom-right-radius: 0.2rem; }
  .ai-chat-msg.assistant { align-self: flex-start; background: var(--surface-container-high); color: var(--text); border-bottom-left-radius: 0.2rem; }

  /* Custom Selects */
  .ms-btn { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 1rem; text-align: left; background: var(--input-bg); color: var(--text); cursor: pointer; }
</style>
</head>

<script>
const SUPABASE_URL = "https://ovklnoroyxobijgvsyfp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_SjOSMDFWO-u9t5sKRp1sXQ_GsnrO2a7";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null;
let profile = null;
let vendor = null;
let favoriteIds = new Set();
let authMode = "login";
let currentView = "home";
let currentSectorId = null;

let aiChatMessages = [];

// Utility
function byId(id) { return document.getElementById(id); }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function naira(n) { return "₦" + Number(n ?? 0).toLocaleString(); }
function initials(name, email) { const s = (name || email || "?").trim(); return s[0]?.toUpperCase() || "?"; }
function showToast(msg, type="info") {
  const wrap = byId("toastStack");
  if(!wrap) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => { el.classList.remove("show"); setTimeout(()=>el.remove(),300); }, 3000);
}

// Drawers
function toggleSettingsPanel() { openDrawer("settingsPanel"); }
function toggleProfilePanel() { openDrawer("profilePanel"); }
function toggleNotifPanel() { openDrawer("notifPanel"); }
function openDrawer(id) {
  closeAllPanels();
  byId(id)?.classList.add("open");
  byId("drawerBackdrop")?.classList.add("open");
}
function closeAllPanels() {
  document.querySelectorAll(".side-drawer").forEach(d => d.classList.remove("open"));
  byId("drawerBackdrop")?.classList.remove("open");
}

function toggleAccordion(btn) {
  const content = btn.nextElementSibling;
  content.classList.toggle("hidden");
}
function setTheme(t) {
  document.documentElement.className = t === 'dark' ? 'dark antialiased min-h-screen flex flex-col' : 'antialiased min-h-screen flex flex-col';
  document.documentElement.setAttribute('data-theme', t);
  closeAllPanels();
}

// Navigation & Routing
async function navigate(view, params = {}) {
  currentView = view;
  const app = byId("app");
  app.innerHTML = '<p class="muted p-8 text-center">Loading…</p>';
  updateAuthUI();
  renderBottomNav();
  window.scrollTo(0,0);
  try {
    if(view === 'home') app.innerHTML = await renderHome();
    else if(view === 'vendors') app.innerHTML = await renderVendorsDirectory();
    else app.innerHTML = `<div class="p-8 text-center text-on-surface-variant">View '${esc(view)}' not fully mapped in preview. Use Home or Vendors.</div>`;
  } catch(e) {
    app.innerHTML = `<div class="p-8 text-center text-error">Error: ${esc(e.message)}</div>`;
  }
}

// Auth
async function refreshAuthState() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  profile = null; vendor = null; favoriteIds = new Set();
  if (session) {
    const { data: p } = await sb.from("users").select("*").eq("id", session.user.id).single();
    profile = p;
    const { data: v } = await sb.from("vendors").select("*").eq("user_id", session.user.id).is("deleted_at", null).maybeSingle();
    vendor = profile?.role === "admin" ? null : v;
  }
  updateAuthUI();
  renderBottomNav();
}

function updateAuthUI() {
  if (session && profile) {
    byId("loginBtn").classList.add("hidden");
    byId("avatarBtn").classList.remove("hidden");
    byId("avatarBtn").innerHTML = `<div class="w-full h-full bg-secondary text-white flex items-center justify-center font-bold">${initials(profile.name, profile.email)}</div>`;
    byId("profilePanel").innerHTML = `
      <div class="flex justify-between items-center mb-6">
        <h4 class="font-bold text-lg">Profile</h4>
        <button onclick="closeAllPanels()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="mb-4"><strong>${esc(profile.name)}</strong><br><span class="text-sm text-text-muted">${esc(profile.email)}</span></p>
      <button class="btn btn-sm btn-danger w-full justify-center" onclick="logout()">Logout</button>
    `;
  } else {
    byId("loginBtn").classList.remove("hidden");
    byId("avatarBtn").classList.add("hidden");
    byId("profilePanel").innerHTML = "";
  }
}

function showLogin() { authMode = "login"; applyAuthMode(); byId("loginModal").classList.remove("hidden"); }
function hideLogin() { byId("loginModal").classList.add("hidden"); }
function toggleAuthMode() { authMode = authMode === "login" ? "register" : "login"; applyAuthMode(); }
function applyAuthMode() {
  const isReg = authMode === "register";
  byId("authModalTitle").textContent = isReg ? "Create Account" : "Welcome Back";
  byId("signupExtraFields").classList.toggle("hidden", !isReg);
  byId("confirmPasswordWrap").classList.toggle("hidden", !isReg);
  byId("authSubmitBtn").textContent = isReg ? "Register" : "Login";
  byId("authToggleLink").textContent = isReg ? "Already have an account? Login" : "Need an account? Register";
  byId("authToggleLink").onclick = (e) => { e.preventDefault(); toggleAuthMode(); };
}

async function submitAuth() {
  const email = byId("loginEmail").value.trim();
  const password = byId("loginPassword").value;
  if (!email || !password) return showToast("Email and password required", "error");
  
  byId("authSubmitBtn").disabled = true;
  try {
    if (authMode === "register") {
      const name = byId("loginName").value.trim();
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name, role: byId("loginRole").value } } });
      if (error) throw error;
      showToast("Signed up successfully!");
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      showToast("Logged in!");
    }
    hideLogin();
    await refreshAuthState();
    navigate("home");
  } catch(e) { showToast(e.message, "error"); }
  byId("authSubmitBtn").disabled = false;
}
async function logout() { await sb.auth.signOut(); await refreshAuthState(); closeAllPanels(); navigate("home"); }
function requireLoginThen(view) { if(!session) showLogin(); else navigate(view); }

// Bottom Nav
function renderBottomNav() {
  const nav = byId("bottomNav");
  if(!nav) return;
  const items = [
    { icon: "fa-house", label: "Home", action: "navigate('home')" },
    { icon: "fa-store", label: "Vendors", action: "navigate('vendors')" },
    { icon: "fa-hand", label: "Request", action: "requireLoginThen('requestEquipment')" },
    { icon: "fa-user", label: "Profile", action: session ? "toggleProfilePanel()" : "showLogin()" }
  ];
  nav.innerHTML = items.map(i => `<button class="bottom-nav-item" onclick="${i.action}"><i class="fa-solid ${i.icon}"></i><span>${i.label}</span></button>`).join("");
}

// AI Chat Logic
function toggleAiChat() {
  const p = byId("aiChatPanel");
  p.classList.toggle("hidden");
  if(!p.classList.contains("hidden") && aiChatMessages.length===0) {
    appendAiChatMessage("assistant", "Hi, I'm Levi! Ask me what buyers are searching for, or anything about Levromart.");
  }
}
function appendAiChatMessage(role, text) {
  aiChatMessages.push({role, content: text});
  const wrap = byId("aiChatMessages");
  const el = document.createElement("div");
  el.className = `ai-chat-msg ${role}`;
  el.textContent = text;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
}
async function sendAiChatMessage() {
  const input = byId("aiChatInput");
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  appendAiChatMessage("user", text);
  try {
    const res = await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages: aiChatMessages}) });
    const json = await res.json();
    appendAiChatMessage("assistant", json.reply || "I'm here to help!");
  } catch(e) {
    appendAiChatMessage("assistant", "I'm offline right now, but I'll be back soon.");
  }
}

// Init
window.onload = async () => {
  byId("footerYear").textContent = new Date().getFullYear();
  setTimeout(() => {
    byId("splashScreen").classList.add("splash-hide");
    setTimeout(() => byId("splashScreen").classList.add("splash-gone"), 400);
  }, 1500);
  await refreshAuthState();
  navigate("home");
};
</script>
