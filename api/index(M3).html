async function uploadVendorLogo(event) {
  const file = event.target.files[0];
  if (!file || !vendor) return;
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${vendor.id}/logo.${ext}`;
  const { error: upErr } = await sb.storage.from("vendor-logos").upload(path, file, { upsert: true, contentType: file.type });
  if (upErr) { showToast(upErr.message, "error"); return; }
  const { data: pub } = sb.storage.from("vendor-logos").getPublicUrl(path);
  const url = `${pub.publicUrl}?t=${Date.now()}`;
  const { error } = await sb.from("vendors").update({ logo_url: url }).eq("id", vendor.id);
  if (error) { showToast(error.message, "error"); return; }
  vendor.logo_url = url;
  navigate("vendorEditProfile");
  showToast("Business logo updated.", "success");
}

// ---------- VENDOR PRODUCTS ----------
let vendorProductsView = "grid"; // 'grid' | 'table'
function toggleVendorProductsView(v) { vendorProductsView = v; navigate("vendorProducts"); }

async function renderVendorProducts() {
  if (!session || (profile?.role !== "vendor" && !vendor)) return '<div class="empty-state">Access denied.</div>';
  const { data: v } = await sb.from("vendors").select("id, verification_status").eq("user_id", session.user.id).maybeSingle();
  if (!v) { navigate("vendorApply"); return '<p class="muted">Redirecting…</p>'; }
  vendor = v;

  const [{ data: products }, { data: orderItems }] = await Promise.all([
    sb.from("products").select("*, category:categories(name)").eq("vendor_id", v.id).order("created_at", { ascending: false }),
    sb.from("order_items").select("product_id, quantity, unit_price, order:orders!inner(status, vendor_id)").eq("order.vendor_id", v.id).eq("order.status", "completed"),
  ]);
  const favCounts = await Promise.all((products || []).map((p) => sb.rpc("get_favorite_count", { p_product_id: p.id })));
  const revenueByProduct = {};
  (orderItems || []).forEach((oi) => { revenueByProduct[oi.product_id] = (revenueByProduct[oi.product_id] || 0) + oi.quantity * oi.unit_price; });

  let html = `<div class="flex" style="justify-content:space-between;">
    <h2>My Products</h2>
    <div class="flex">
      <button class="btn btn-sm ${vendorProductsView === "grid" ? "" : "btn-outline"}" onclick="toggleVendorProductsView('grid')"><i class="fa-solid fa-grip"></i> Grid</button>
      <button class="btn btn-sm ${vendorProductsView === "table" ? "" : "btn-outline"}" onclick="toggleVendorProductsView('table')"><i class="fa-solid fa-table-list"></i> Inventory</button>
      <button class="btn" onclick="openAddProductModal()">+ Add product</button>
    </div>
  </div>`;
  if (v.verification_status !== "verified") html += `<p class="muted">Products won't appear publicly until your vendor account is verified.</p>`;

  if (!products || products.length === 0) { html += `<div class="empty-state">No products yet.</div>`; return html; }

  if (vendorProductsView === "table") {
    const totalRevenue = Object.values(revenueByProduct).reduce((s, n) => s + n, 0);
    const totalUnits = products.reduce((s, p) => s + p.quantity_total, 0);
    html += `<div class="grid" style="grid-template-columns:repeat(3,1fr);max-width:600px;margin-bottom:1rem;">
      <div class="stat"><div class="n">${products.length}</div><div class="muted">Products</div></div>
      <div class="stat"><div class="n">${totalUnits}</div><div class="muted">Total units</div></div>
      <div class="stat"><div class="n">${naira(totalRevenue)}</div><div class="muted">Revenue (completed)</div></div>
    </div>`;
    html += `<div class="table-wrap"><table class="data-table"><thead><tr>
      <th>Product</th><th>Category</th><th>Price</th><th>Qty avail / total</th><th>Views</th><th>Saved</th><th>Revenue</th><th>Status</th>
    </tr></thead><tbody>`;
    products.forEach((p, i) => {
      html += `<tr onclick="openEditProductModal('${p.id}')" style="cursor:pointer;">
        <td>${esc(p.name)}</td>
        <td>${esc(p.category?.name || "Uncategorized")}</td>
        <td>${p.sale_price != null ? naira(p.sale_price) : ""}${p.sale_price != null && p.rental_rate != null ? " / " : ""}${p.rental_rate != null ? naira(p.rental_rate) + "/" + p.rental_rate_unit : ""}</td>
        <td>${p.quantity_available} / ${p.quantity_total}</td>
        <td>${p.view_count || 0}</td>
        <td>${favCounts[i]?.data ?? 0}</td>
        <td>${naira(revenueByProduct[p.id] || 0)}</td>
        <td><span class="badge ${p.status === "active" ? "success" : p.status === "paused" ? "warning" : "danger"}">${esc(p.status)}</span></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  }

  const groups = new Map();
  products.forEach((p) => {
    const key = p.category?.name || "Uncategorized";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  [...groups.keys()].sort().forEach((catName) => {
    html += `<div class="category-group-header"><i class="fa-solid ${catName === "Uncategorized" ? "fa-box-open" : "fa-tag"}"></i> ${esc(catName)}</div>`;
    html += `<div class="grid">`;
    groups.get(catName).forEach((p) => {
      const img = p.photos?.[0];
      const favCount = favCounts[products.indexOf(p)]?.data ?? 0;
      html += `<div class="card">
        <div class="product-img">${img ? `<img src="${esc(img)}" style="width:100%;height:100%;object-fit:cover;">` : "<i class='fa-solid fa-camera'></i> No image"}</div>
        <h4 style="margin:0.5rem 0 0.2rem;">${esc(p.name)}</h4>
        <p class="muted">${p.listing_type} · ${p.quantity_available}/${p.quantity_total} available · ${p.status}</p>
        <p class="muted" style="font-size:0.8rem;"><i class='fa-solid fa-eye'></i> ${p.view_count || 0} views · <i class='fa-solid fa-heart'></i> ${favCount} saved · <i class="fa-solid fa-sack-dollar"></i> ${naira(revenueByProduct[p.id] || 0)}</p>
        <div class="flex">
          <button class="btn btn-sm" onclick="openEditProductModal('${p.id}')"><i class='fa-solid fa-pen'></i> Edit</button>
          ${p.status === "active" ? `<button class="btn btn-sm" style="background:#6b7280;" onclick="setProductStatus('${p.id}','paused')">Pause</button>` : ""}
          ${p.status === "paused" ? `<button class="btn btn-sm" onclick="setProductStatus('${p.id}','active')">Activate</button>` : ""}
          ${p.status !== "removed" ? `<button class="btn btn-sm btn-danger" onclick="removeProduct('${p.id}')"><i class='fa-solid fa-trash'></i> Remove</button>` : ""}
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

async function openAddProductModal() {
  editingProductId = null;
  await showProductModal();
}
async function openEditProductModal(productId) {
  editingProductId = productId;
  await showProductModal();
}

async function showProductModal() {
  const { data: categories } = await sb.from("categories").select("*").order("name");
  const select = byId("prodCategory");
  select.innerHTML = '<option value="">Uncategorized</option>';
  (categories || []).filter((c) => !c.parent_category_id).forEach((parent) => {
    const group = document.createElement("optgroup");
    group.label = parent.name;
    categories.filter((c) => c.parent_category_id === parent.id).forEach((child) => {
      const opt = document.createElement("option");
      opt.value = child.id; opt.textContent = child.name;
      group.appendChild(opt);
    });
    select.appendChild(group);
  });

  byId("productError").classList.add("hidden");
  byId("prodExistingPhotos").innerHTML = "";
  window.__existingPhotos = [];

  if (editingProductId) {
    const { data: p } = await sb.from("products").select("*").eq("id", editingProductId).single();
    byId("productModalTitle").textContent = "Edit Product";
    byId("prodName").value = p.name;
    byId("prodDesc").value = p.description || "";
    byId("prodCategory").value = p.category_id || "";
    byId("prodCondition").value = p.condition;
    byId("prodListingType").value = p.listing_type;
    byId("prodSalePrice").value = p.sale_price ?? "";
    byId("prodRentalRate").value = p.rental_rate ?? "";
    byId("prodRateUnit").value = p.rental_rate_unit || "day";
    byId("prodDeposit").value = p.deposit_amount ?? "";
    byId("prodQtyTotal").value = p.quantity_total;
    window.__existingPhotos = p.photos || [];
    renderExistingPhotos();
  } else {
    byId("productModalTitle").textContent = "Add New Product";
    ["prodName", "prodDesc", "prodSalePrice", "prodRentalRate", "prodDeposit"].forEach((id) => (byId(id).value = ""));
    byId("prodQtyTotal").value = 1;
    byId("prodListingType").value = "rent";
  }
  updateProductFormFields();
  byId("productModal").classList.remove("hidden");
}

function renderExistingPhotos() {
  byId("prodExistingPhotos").innerHTML = (window.__existingPhotos || [])
    .map((url) => `<div style="position:relative;"><img src="${esc(url)}" class="thumb" /><button type="button" onclick="removeExistingPhoto('${esc(url)}')" style="position:absolute;top:-6px;right:-6px;border-radius:999px;background:var(--danger);color:white;border:none;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;">×</button></div>`)
    .join("");
}
function removeExistingPhoto(url) {
  window.__existingPhotos = (window.__existingPhotos || []).filter((u) => u !== url);
  renderExistingPhotos();
}

function updateProductFormFields() {
  const type = byId("prodListingType").value;
  byId("prodSalePriceWrap").classList.toggle("hidden", type === "rent");
  byId("prodRentalRateWrap").classList.toggle("hidden", type === "sale");
  byId("prodRateUnitWrap").classList.toggle("hidden", type === "sale");
  byId("prodDepositWrap").classList.toggle("hidden", type === "sale");
}

function closeProductModal() { byId("productModal").classList.add("hidden"); }

async function saveProduct() {
  const errorEl = byId("productError");
  errorEl.classList.add("hidden");
  const btn = byId("saveProductBtn");
  btn.disabled = true;

  try {
    const listing_type = byId("prodListingType").value;
    const name = byId("prodName").value.trim();
    const quantity_total = parseInt(byId("prodQtyTotal").value) || 1;
    const sale_price = byId("prodSalePrice").value ? Number(byId("prodSalePrice").value) : null;
    const rental_rate = byId("prodRentalRate").value ? Number(byId("prodRentalRate").value) : null;
    const rental_rate_unit = byId("prodRateUnit").value;
    if (!name) throw new Error("Product name is required.");
    if (listing_type !== "rent" && !sale_price) throw new Error("Sale price is required for a sale listing.");
    if (listing_type !== "sale" && !rental_rate) throw new Error("Rental rate is required for a rental listing.");

    const fields = {
      name,
      description: byId("prodDesc").value.trim() || null,
      category_id: byId("prodCategory").value || null,
      condition: byId("prodCondition").value,
      listing_type,
      sale_price: listing_type === "rent" ? null : sale_price,
      rental_rate: listing_type === "sale" ? null : rental_rate,
      rental_rate_unit: listing_type === "sale" ? null : rental_rate_unit,
      deposit_amount: byId("prodDeposit").value ? Number(byId("prodDeposit").value) : null,
      quantity_total,
    };

    const newFiles = [...byId("prodPhotoFiles").files];
    const newPhotoUrls = [];
    for (const file of newFiles) {
      const ext = file.name.split(".").pop() || "jpg";
      const path = `${vendor.id}/${crypto.randomUUID()}.${ext}`;
      const { error: upErr } = await sb.storage.from("product-photos").upload(path, file, { contentType: file.type });
      if (upErr) throw new Error(`Photo upload failed: ${upErr.message}`);
      const { data } = sb.storage.from("product-photos").getPublicUrl(path);
      newPhotoUrls.push(data.publicUrl);
    }
    const photos = [...(window.__existingPhotos || []), ...newPhotoUrls];

    if (editingProductId) {
      const { data: existing } = await sb.from("products").select("quantity_total, quantity_available").eq("id", editingProductId).single();
      const sold = existing ? existing.quantity_total - existing.quantity_available : 0;
      const quantity_available = Math.max(quantity_total - sold, 0);
      const { error } = await sb.from("products").update({ ...fields, quantity_available, photos }).eq("id", editingProductId);
      if (error) throw new Error(error.message);
    } else {
      const { error } = await sb.from("products").insert({ ...fields, vendor_id: vendor.id, quantity_available: quantity_total, photos });
      if (error) throw new Error(error.message);
    }

    closeProductModal();
    navigate("vendorProducts");
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove("hidden");
  } finally {
    btn.disabled = false;
  }
}

async function setProductStatus(id, status) {
  const { error } = await sb.from("products").update({ status }).eq("id", id).eq("vendor_id", vendor.id);
  if (error) { showToast(error.message, "error"); return; }
  navigate("vendorProducts");
}
async function removeProduct(id) {
  if (await showConfirmDialog("Remove this listing? It will no longer be visible to buyers.", { title: "Remove listing", okLabel: "Remove", danger: true })) setProductStatus(id, "removed");
}

// ---------- VENDOR / BUYER ORDERS ----------
const ORDER_TABS = ["all", "pending", "confirmed", "handed_over", "returned", "completed", "cancelled", "disputed"];

async function renderVendorOrders(status) {
  if (!session || (profile?.role !== "vendor" && !vendor)) return '<div class="empty-state">Access denied.</div>';
  if (!vendor) { const { data: v } = await sb.from("vendors").select("id").eq("user_id", session.user.id).maybeSingle(); vendor = v; }
  if (!vendor) { navigate("vendorApply"); return '<p class="muted">Redirecting…</p>'; }
  status = ORDER_TABS.includes(status) ? status : "all";

  let query = sb.from("orders").select("id, order_type, status, total_amount, buyer:users(name)").eq("vendor_id", vendor.id);
  if (status !== "all") query = query.eq("status", status);
  const { data: orders } = await query.order("created_at", { ascending: false });

  let html = `<h2>Orders</h2><div class="tabs">${ORDER_TABS.map((t) => `<a class="${t === status ? "active" : ""}" onclick="navigate('vendorOrders',{status:'${t}'})">${t}</a>`).join("")}</div>`;
  html += orderListHtml(orders, false);
  html += `<button class="btn btn-sm" style="margin-top:1rem;" onclick="navigate('vendorDashboard')"><i class='fa-solid fa-arrow-left'></i> Back to Dashboard</button>`;
  return html;
}

async function renderBuyerOrders() {
  if (!session) return '<div class="empty-state">Please log in.</div>';
  const { data: orders } = await sb.from("orders").select("id, order_type, status, total_amount, vendor:vendors(business_name)").eq("buyer_id", session.user.id).order("created_at", { ascending: false });
  let html = `<h2><i class='fa-solid fa-clipboard-list'></i> My Orders</h2>`;
  html += orderListHtml(orders, true);
  html += `<button class="btn btn-sm" style="margin-top:1rem;" onclick="navigate('home')"><i class='fa-solid fa-arrow-left'></i> Continue shopping</button>`;
  return html;
}

function orderListHtml(orders, isBuyerView) {
  if (!orders || orders.length === 0) return '<div class="empty-state">No orders here.</div>';
  return orders.map((o) => `
    <div class="card flex" style="justify-content:space-between;cursor:pointer;" onclick="navigate('orderDetail',{orderId:'${o.id}'})">
      <div>
        <strong>${isBuyerView ? esc(o.vendor?.business_name || "") : esc(o.buyer?.name || "")}</strong>
        <p class="muted" style="text-transform:capitalize;">${o.order_type} · ${naira(o.total_amount)}</p>
      </div>
      <span class="badge">${o.status}</span>
    </div>`).join("");
}

// ---------- ORDER DETAIL ----------
async function renderOrderDetail(orderId) {
  if (!session) return '<div class="empty-state">Please log in.</div>';
  const { data: order, error } = await sb
    .from("orders")
    .select("*, vendor:vendors(id, business_name, phone, whatsapp_number, user_id), items:order_items(id, quantity, unit_price, rental_start_date, rental_end_date, product:products(name)), payments(*), review:reviews(id), disputes(id, reason, status, admin_notes, vendor_response, created_at)")
    .eq("id", orderId)
    .maybeSingle();
  if (error || !order) return '<div class="empty-state">Order not found.</div>';

  const isBuyer = order.buyer_id === session.user.id;
  const isVendor = order.vendor?.user_id === session.user.id;
  if (!isBuyer && !isVendor && profile?.role !== "admin") return '<div class="empty-state">Access denied.</div>';

  const feeType = order.order_type === "sale" ? "sale_price" : "rental_fee";
  const feePaid = order.payments.some((p) => p.payment_type === feeType && p.status === "paid");
  const depositPaid = order.deposit_amount === 0 || order.payments.some((p) => p.payment_type === "deposit" && p.status === "paid");
  const canRecordPayment = isVendor && !(feePaid && depositPaid) && ["pending", "confirmed"].includes(order.status);
  const canPayOnline = isBuyer && !(feePaid && depositPaid) && ["pending", "confirmed"].includes(order.status);

  let html = `<div class="flex" style="justify-content:space-between;"><h2 style="text-transform:capitalize;">${order.order_type} order</h2><span class="badge">${order.status.replace("_", " ")}</span></div>
  <p class="muted">${isVendor ? "Buyer order" : esc(order.vendor?.business_name || "")}</p>
  ${ORDER_STATUS_HELP[order.status] ? `<p class="muted" style="font-size:0.85rem;margin-top:0.3rem;"><i class="fa-solid fa-circle-info"></i> ${esc(ORDER_STATUS_HELP[order.status])}</p>` : ""}`;

  html += order.items.map((item) => `<div class="card">
    <strong>${esc(item.product?.name || "")}</strong>
    <p class="muted">Qty ${item.quantity} · ${naira(item.unit_price)}${item.rental_start_date ? ` · ${item.rental_start_date} → ${item.rental_end_date}` : ""}</p>
  </div>`).join("");

  html += `<div class="grid" style="grid-template-columns:repeat(2,1fr);">
    <div><p class="muted">Total</p><strong>${naira(order.total_amount)}</strong></div>
    ${order.deposit_amount > 0 ? `<div><p class="muted">Refundable deposit</p><strong>${naira(order.deposit_amount)}</strong></div>` : ""}
    <div><p class="muted">Delivery</p><strong style="text-transform:capitalize;">${order.delivery_method}${order.delivery_address ? " · " + esc(order.delivery_address) : ""}</strong></div>
  </div>`;

  if (order.payments.length > 0) {
    html += `<h3 style="margin-top:1rem;">Payments</h3>` + order.payments.map((p) => `<div class="flex" style="justify-content:space-between;font-size:0.9rem;"><span style="text-transform:capitalize;">${p.payment_type.replace("_", " ")}</span><span>${naira(p.amount)} · ${p.status}</span></div>`).join("");
  }

  if (canPayOnline) {
    html += `<div class="card"><h3><i class="fa-solid fa-credit-card"></i> Pay online</h3>
      <p class="muted">Pay by card, bank transfer or USSD through Paystack — instant, and the vendor gets notified right away.</p>
      <div id="payOnlineError" class="error-text hidden"></div>
      <button class="btn btn-sm" id="payOnlineBtn" onclick="payOnline('${order.id}')"><i class="fa-solid fa-credit-card"></i> Pay ${naira(feePaid ? order.deposit_amount : order.total_amount)} now</button>
    </div>`;
  }

  if (canRecordPayment) {
    html += `<div class="card"><h3>Record a payment you collected</h3>
      <div id="recordPaymentError" class="error-text hidden"></div>
      <div class="flex">
        <select id="rpType"><option value="${feeType}">${feeType === "sale_price" ? "Sale price" : "Rental fee"}</option><option value="deposit">Deposit</option></select>
        <input type="number" id="rpAmount" value="${feePaid ? order.deposit_amount : order.total_amount}" style="width:120px;" />
        <select id="rpMethod"><option value="cash">Cash</option><option value="transfer">Transfer</option></select>
        <button class="btn btn-sm" onclick="recordOfflinePayment('${order.id}')">Record payment received</button>
      </div>
    </div>`;
  }

  html += `<div class="flex" style="margin-top:1rem;">${orderActionButtonsHtml(order, isBuyer, isVendor)}</div>`;

  if (isBuyer && order.status === "completed" && !order.review) {
    html += `<div class="card"><h3>Leave a review</h3>
      <div id="reviewError" class="error-text hidden"></div>
      ${starRatingWidgetHtml(5)}
      <input type="hidden" id="reviewRating" value="5" />
      <textarea id="reviewComment" rows="2" placeholder="How was the equipment and vendor?"></textarea>
      <button class="btn btn-sm" onclick="submitReview('${order.id}','${order.vendor.id}')">Submit review</button>
    </div>`;
  }

  const dispute = (order.disputes || [])[0];
  if (dispute) {
    html += `<div class="card" style="border-color:var(--danger);margin-top:1rem;">
      <div class="flex" style="justify-content:space-between;"><h3 style="margin:0;"><i class='fa-solid fa-triangle-exclamation'></i> Dispute</h3><span class="badge">${esc(dispute.status)}</span></div>
      <p style="margin:0.5rem 0;"><strong>Reason:</strong> ${esc(dispute.reason)}</p>
      ${dispute.vendor_response ? `<p style="margin:0.5rem 0;"><strong>Vendor response:</strong> ${esc(dispute.vendor_response)}</p>` : ""}
      ${dispute.admin_notes ? `<p style="margin:0.5rem 0;"><strong>Resolution notes:</strong> ${esc(dispute.admin_notes)}</p>` : ""}
      ${isVendor ? `
        <div id="vendorDisputeResponseArea" style="margin-top:0.5rem;">
          <div id="vendorDisputeError" class="error-text hidden"></div>
          <textarea id="vendorDisputeResponse" rows="2" placeholder="Give your side of the story…">${esc(dispute.vendor_response || "")}</textarea>
          <button class="btn btn-sm" onclick="submitVendorDisputeResponse('${dispute.id}','${order.id}')">${dispute.vendor_response ? "Update response" : "Submit response"}</button>
        </div>` : ""}
    </div>`;
  } else if ((isBuyer || isVendor) && order.status !== "cancelled") {
    html += `<div style="margin-top:1rem;">
      <a href="#" onclick="byId('disputeForm').classList.remove('hidden');this.classList.add('hidden');return false;" style="color:var(--danger);">Report an issue with this order</a>
      <div id="disputeForm" class="card hidden" style="border-color:var(--danger);margin-top:0.5rem;">
        <div id="disputeError" class="error-text hidden"></div>
        <textarea id="disputeReason" rows="2" placeholder="What went wrong?"></textarea>
        <button class="btn btn-sm btn-danger" onclick="fileDispute('${order.id}')">Submit report</button>
      </div>
    </div>`;
  }

  html += `<button class="btn btn-sm" style="margin-top:1rem;background:#6b7280;" onclick="navigate('${isVendor ? "vendorOrders" : "buyerOrders"}',{status:'all'})"><i class='fa-solid fa-arrow-left'></i> Back to orders</button>`;
  return html;
}

function orderActionButtonsHtml(order, isBuyer, isVendor) {
  const buttons = [];
  if (isVendor) {
    if (order.status === "pending") { buttons.push(`<button class="btn btn-sm" onclick="updateOrderStatus('${order.id}','confirmed')">Confirm order</button>`); buttons.push(`<button class="btn btn-sm btn-danger" onclick="updateOrderStatus('${order.id}','cancelled')">Decline</button>`); }
    if (order.status === "confirmed") buttons.push(`<button class="btn btn-sm" onclick="updateOrderStatus('${order.id}','handed_over')">Mark handed over</button>`);
    if (order.status === "handed_over" && order.order_type === "rental") buttons.push(`<button class="btn btn-sm" onclick="updateOrderStatus('${order.id}','returned')">Mark returned</button>`);
    if (order.status === "handed_over" && order.order_type === "sale") buttons.push(`<button class="btn btn-sm" onclick="updateOrderStatus('${order.id}','completed')">Mark completed</button>`);
    if (order.status === "returned") buttons.push(`<button class="btn btn-sm" onclick="updateOrderStatus('${order.id}','completed')">Mark completed</button>`);
  }
  if (isBuyer && order.status === "pending") buttons.push(`<button class="btn btn-sm" style="background:#6b7280;" onclick="updateOrderStatus('${order.id}','cancelled')">Cancel order</button>`);
  if (isBuyer && order.status === "handed_over" && order.order_type === "rental") buttons.push(`<button class="btn btn-sm" onclick="updateOrderStatus('${order.id}','returned')">I've returned this equipment</button>`);
  return buttons.join("");
}

const ORDER_STATUS_HELP = {
  pending: "Waiting for the vendor to confirm your order.",
  confirmed: "The vendor has accepted — next they'll hand over the equipment.",
  handed_over: "The equipment has physically been handed to the buyer (picked up or delivered). For rentals, either side can mark it \"returned\" once it's back with the vendor.",
  returned: "The rented equipment is back with the vendor — the order is wrapped up once they mark it completed.",
  completed: "This order is finished.",
  cancelled: "This order was cancelled.",
  disputed: "An issue was reported on this order — an admin is reviewing it.",
};

async function adminToggleVendorActive(vendorId, currentlyActive) {
  const action = currentlyActive ? "pause" : "reactivate";
  if (!(await showConfirmDialog(
    currentlyActive
      ? "Pause this vendor's storefront? Buyers won't be able to see their shop or products until you reactivate it."
      : "Reactivate this vendor's storefront?",
    { title: `${action[0].toUpperCase()}${action.slice(1)} storefront`, okLabel: action[0].toUpperCase() + action.slice(1), danger: currentlyActive }
  ))) return;
  const { error } = await sb.from("vendors").update({ is_active: !currentlyActive }).eq("id", vendorId);
  if (error) { showToast(error.message, "error"); return; }
  showToast(`Storefront ${currentlyActive ? "paused" : "reactivated"}.`, "success");
  navigate("adminFinance");
}

// ---------- INIT ----------
// Fires on sign-in, sign-out, and token refresh — including the background
// sign-in Supabase performs when a user lands here via an email
// confirmation link. Re-running the full profile lookup (not just the bare
// session) is what keeps the header in sync with that background event.
let __authRefreshInFlight = null;
function refreshAuthStateOnce() {
  if (!__authRefreshInFlight) {
    __authRefreshInFlight = refreshAuthState().finally(() => { __authRefreshInFlight = null; });
  }
  return __authRefreshInFlight;
}

sb.auth.onAuthStateChange((_event) => {
  refreshAuthStateOnce();
});

// Phone back-button / back-gesture support: each navigate() push a history
// entry, so the OS back action pops us to the previous in-app screen
// instead of leaving the page.
// ---------- FLOATING AI CHAT (draggable) ----------
let aiChatMessages = [];
function toggleAiChat() {
  const panel = byId("aiChatPanel");
  panel.classList.toggle("hidden");
  if (!panel.classList.contains("hidden")) {
    playSound("open");
    if (aiChatMessages.length === 0) {
      appendAiChatMessage("assistant", "Hi! I'm the Medris Assistant. Ask me what equipment you need, how renting, buying or requesting works, or anything else about the marketplace.");
    }
    byId("aiChatInput").focus();
  }
}
function appendAiChatMessage(role, content) {
  if (role !== "typing") aiChatMessages.push({ role, content });
  const wrap = byId("aiChatMessages");
  const el = document.createElement("div");
  el.className = `ai-chat-msg ${role === "typing" ? "assistant" : role}`;
  if (role === "typing") { el.id = "aiChatTyping"; el.innerHTML = `<i class="fa-solid fa-ellipsis" style="opacity:.6;"></i>`; }
  else el.textContent = content;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
}
async function sendAiChatMessage() {
  const input = byId("aiChatInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  appendAiChatMessage("user", text);
  appendAiChatMessage("typing", "");
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: aiChatMessages.filter((m) => m.role !== "typing") }),
    });
    const json = await res.json();
    byId("aiChatTyping")?.remove();
    if (!res.ok) throw new Error(json.error || "AI service unavailable.");
    appendAiChatMessage("assistant", json.reply);
    playSound("notify");
  } catch (err) {
    byId("aiChatTyping")?.remove();
    appendAiChatMessage("assistant", `Sorry, I'm not available right now — ${err.message}`);
  }
}

// Draggable floating action button — repositions with pointer drag; a tap
// (no real movement) opens the chat instead of dragging it.
(function setupAiChatFabDrag() {
  const fab = byId("aiChatFab");
  let dragging = false, moved = false, startX = 0, startY = 0, startRight = 0, startBottom = 0;
  fab.addEventListener("pointerdown", (e) => {
    dragging = true; moved = false;
    fab.setPointerCapture(e.pointerId);
    const rect = fab.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startRight = window.innerWidth - rect.right;
    startBottom = window.innerHeight - rect.bottom;
  });
  fab.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    if (!moved) return;
    let right = startRight - dx, bottom = startBottom - dy;
    right = Math.max(4, Math.min(window.innerWidth - fab.offsetWidth - 4, right));
    bottom = Math.max(4, Math.min(window.innerHeight - fab.offsetHeight - 4, bottom));
    fab.style.right = `${right}px`;
    fab.style.bottom = `${bottom}px`;
  });
  fab.addEventListener("pointerup", (e) => { dragging = false; fab.releasePointerCapture(e.pointerId); });
  fab.addEventListener("click", (e) => {
    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; return; }
    toggleAiChat();
  });
})();

window.addEventListener("popstate", (e) => {
  if (e.state && e.state.view) navigate(e.state.view, e.state.params || {}, false);
  else navigate("home", {}, false);
});

(async function init() {
  initTheme();
  initAccent();
  initSound();
  history.replaceState({ view: "home", params: {} }, "", location.pathname + location.search);
  await refreshAuthStateOnce();

  const urlParams = new URLSearchParams(location.search);
  if (urlParams.get("paid") === "1" && urlParams.get("reference")) {
    const reference = urlParams.get("reference");
    const orderId = urlParams.get("orderId");
    history.replaceState({ view: "home", params: {} }, "", location.pathname);
    try {
      const res = await fetch(`/api/verify-payment?reference=${encodeURIComponent(reference)}`);
      const json = await res.json();
      if (json.status === "success") showToast("Payment received — thank you!", "success");
      else showToast("We couldn't confirm that payment yet. It may still be processing.", "info");
    } catch (e) {
      showToast("Couldn't reach the payment verification service.", "error");
    }
    if (orderId) { await navigate("orderDetail", { orderId }); return; }
  }

  if (urlParams.get("commissionPaid") === "1" && urlParams.get("reference")) {
    const reference = urlParams.get("reference");
    history.replaceState({ view: "home", params: {} }, "", location.pathname);
    try {
      const res = await fetch(`/api/verify-payment?reference=${encodeURIComponent(reference)}`);
      const json = await res.json();
      if (json.status === "success") showToast("Commission settled — thank you!", "success");
      else showToast("We couldn't confirm that payment yet. It may still be processing.", "info");
    } catch (e) {
      showToast("Couldn't reach the payment verification service.", "error");
    }
    await navigate("vendorEditProfile");
    return;
  }

  navigate("home");
})();
