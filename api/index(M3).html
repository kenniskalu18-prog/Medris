<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Medris – Medical Equipment Marketplace</title>
<link id="faviconLink" rel="icon" type="image/webp" href="">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #0f766e;
    --primary-light: #14b8a6;
    --primary-grad: linear-gradient(135deg, #0f766e, #14b8a6 60%, #2dd4bf);
    --bg: #f5f7fa;
    --bg-wash: radial-gradient(at top left, rgba(20,184,166,0.10), transparent 55%), radial-gradient(at bottom right, rgba(15,118,110,0.08), transparent 50%);
    --card: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --input-bg: #ffffff;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #16a34a;
    --glass-bg: rgba(255,255,255,0.72);
    --glass-border: rgba(255,255,255,0.4);
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-float: 0 10px 24px rgba(15,23,42,0.16);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --primary: #2dd4bf;
    --primary-light: #5eead4;
    --primary-grad: linear-gradient(135deg, #0f766e, #2dd4bf 60%, #5eead4);
    --bg: #0f172a;
    --bg-wash: radial-gradient(at top left, rgba(45,212,191,0.10), transparent 55%), radial-gradient(at bottom right, rgba(15,118,110,0.14), transparent 50%);
    --card: #1e293b;
    --text: #e8edf5;
    --text-muted: #94a3b8;
    --border: #334155;
    --input-bg: #1e293b;
    --glass-bg: rgba(30,41,59,0.65);
    --glass-border: rgba(255,255,255,0.08);
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-float: 0 12px 28px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    color-scheme: dark;
  }
  [data-theme="black"] {
    --primary: #2dd4bf;
    --primary-light: #5eead4;
    --primary-grad: linear-gradient(135deg, #0f766e, #2dd4bf 60%, #5eead4);
    --bg: #000000;
    --bg-wash: radial-gradient(at top left, rgba(45,212,191,0.08), transparent 55%), radial-gradient(at bottom right, rgba(15,118,110,0.10), transparent 50%);
    --card: #111111;
    --text: #f5f5f5;
    --text-muted: #a3a3a3;
    --border: #262626;
    --input-bg: #111111;
    --glass-bg: rgba(17,17,17,0.6);
    --glass-border: rgba(255,255,255,0.06);
    --shadow: 0 1px 3px rgba(0,0,0,0.6);
    --shadow-float: 0 12px 30px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.07);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { max-width: 100%; overflow-x: hidden; overscroll-behavior-x: none; }
  body {
    font-family: system-ui, -apple-system, sans-serif; color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    background-color: var(--bg); background-image: var(--bg-wash); background-attachment: fixed;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  header {
    background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--text); padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.8rem;
    position: sticky; top: 0; z-index: 50; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  }
  header h1 { font-size: 1.4rem; cursor: pointer; user-select: none; white-space: nowrap; background: var(--primary-grad); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-flex; align-items: center; gap: 0.5rem; }
  .brand-logo { height: 2.1rem; width: auto; vertical-align: middle; animation: logoPulse 3s ease-in-out infinite; }
  @keyframes logoPulse {
    0%, 100% { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--primary) 45%, transparent)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 15px color-mix(in srgb, var(--primary-light) 80%, transparent)); transform: scale(1.07); }
  }
  @media (prefers-reduced-motion: reduce) { .brand-logo { animation: none; } }
  .login-modal-logo { width: 4.5rem; height: auto; display: block; margin: 0 auto 0.6rem; filter: drop-shadow(0 0 12px color-mix(in srgb, var(--primary) 45%, transparent)); }
  .ai-chat-fab-logo { width: 2.5rem; height: auto; object-fit: contain; }
  .header-left { display: flex; align-items: center; gap: 0.8rem; min-width: 0; }
  .header-right { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
  .btn { padding: 0.5rem 1.2rem; border: none; border-radius: 0.6rem; background: var(--primary-grad); color: white; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; transition: filter 0.15s, transform 0.1s; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(0.97); }
  .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
  .btn-outline:hover { background: color-mix(in srgb, var(--primary) 12%, transparent); filter: none; }
  .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.85rem; }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { filter: brightness(1.1); }
  .btn-warning { background: var(--warning); color: white; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .container { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; flex: 1; width: 100%; }
  .card { background: var(--card); padding: 1.3rem; border-radius: 0.9rem; box-shadow: var(--shadow); margin-bottom: 1rem; border: 1px solid var(--border); transition: background-color 0.25s ease, border-color 0.25s ease; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; }
  .flex { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .badge { padding: 0.2rem 0.8rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 500; background: color-mix(in srgb, var(--primary) 16%, transparent); color: var(--primary); text-transform: capitalize; }
  .badge.success { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
  .badge.warning { background: color-mix(in srgb, var(--warning) 20%, transparent); color: var(--warning); }
  .badge.danger { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .banner { border-radius: 0.9rem; padding: 1rem 1.2rem; margin-bottom: 1rem; border: 1px solid; color: var(--text); }
  .banner-success { background: color-mix(in srgb, var(--success) 16%, var(--card)); border-color: color-mix(in srgb, var(--success) 35%, var(--card)); }
  .banner-warning { background: color-mix(in srgb, var(--warning) 16%, var(--card)); border-color: color-mix(in srgb, var(--warning) 35%, var(--card)); }
  .banner-danger { background: color-mix(in srgb, var(--danger) 16%, var(--card)); border-color: color-mix(in srgb, var(--danger) 35%, var(--card)); }
  .banner-muted { background: var(--card); border-color: var(--border); }
  label { display: block; font-size: 0.85rem; font-weight: 500; margin-top: 0.6rem; }
  input, select, textarea { width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 0.5rem; margin: 0.3rem 0 0.5rem; font-size: 1rem; font-family: inherit; background: var(--input-bg); color: var(--text); transition: background-color 0.25s ease, border-color 0.25s ease; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
  fieldset { border: none; padding: 0; margin-top: 0.5rem; }
  legend { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
  .hidden { display: none !important; }
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; overflow-y: auto; backdrop-filter: blur(3px); }
  .modal-content { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); color: var(--text); padding: 2rem; border-radius: 1.1rem; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
  .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 0.5rem; background: var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.9rem; }
  .divider { border: 0; border-top: 1px solid var(--border); margin: 1rem 0; }
  .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
  .error-text { color: var(--danger); font-size: 0.85rem; margin: 0.3rem 0; }
  .muted { color: var(--text-muted); font-size: 0.9rem; }
  .tabs { display: flex; gap: 1rem; border-bottom: 1px solid var(--border); margin: 1rem 0; flex-wrap: wrap; }
  .tabs a { padding-bottom: 0.5rem; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; font-size: 0.9rem; cursor: pointer; text-transform: capitalize; }
  .tabs a.active { color: var(--primary); border-color: var(--primary); font-weight: 600; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 0.8rem; padding: 1rem; text-align: center; }
  .stat .n { font-size: 1.5rem; font-weight: 700; background: var(--primary-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 0.4rem; }
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 0.9rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
  .data-table th, .data-table td { padding: 0.7rem 0.9rem; text-align: left; border-bottom: 1px solid var(--border); }
  .data-table th { color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table tbody tr:hover { background: color-mix(in srgb, var(--primary) 5%, transparent); }
  .category-group-header { display: flex; align-items: center; gap: 0.6rem; margin: 1.4rem 0 0.8rem; font-size: 1rem; font-weight: 600; color: var(--text-muted); }
  .category-group-header i { color: var(--primary); }
  .star-rating { display: flex; gap: 0.35rem; font-size: 1.7rem; margin: 0.6rem 0; }
  .star-rating i { color: var(--border); cursor: pointer; transition: color 0.15s, transform 0.1s; }
  .star-rating i:hover { transform: scale(1.15); }
  .star-rating i.active { color: #f59e0b; }
  .star-display { color: #f59e0b; font-size: 0.85rem; letter-spacing: 0.1rem; }
  .review-card { display: flex; gap: 0.8rem; align-items: flex-start; }

  /* ---- floating draggable AI chat ---- */
  .ai-chat-fab {
    position: fixed; right: 1.2rem; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); width: 3.4rem; height: 3.4rem; border-radius: 50%;
    background: var(--primary-grad); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    box-shadow: var(--shadow-float); cursor: grab; z-index: 150; touch-action: none; user-select: none;
    animation: fabPulse 3s ease-in-out infinite;
  }
  .ai-chat-fab:active { cursor: grabbing; }
  @media (max-width: 720px) { .ai-chat-fab { bottom: calc(4.6rem + env(safe-area-inset-bottom, 0px)); } }
  @keyframes fabPulse {
    0%, 100% { box-shadow: var(--shadow-float); }
    50% { box-shadow: var(--shadow-float), 0 0 0 9px color-mix(in srgb, var(--primary) 16%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { .ai-chat-fab { animation: none; } }
  .ai-chat-panel {
    position: fixed; right: 1.2rem; bottom: calc(5.2rem + env(safe-area-inset-bottom, 0px)); width: min(360px, 90vw); height: min(500px, 68vh);
    background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border); border-radius: 1.1rem; box-shadow: 0 20px 50px rgba(0,0,0,0.3); z-index: 150;
    display: flex; flex-direction: column; padding: 1rem; color: var(--text);
  }
  .ai-chat-panel.hidden { display: none; }
  .ai-chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; margin: 0.5rem 0; }
  .ai-chat-msg { max-width: 84%; padding: 0.6rem 0.85rem; border-radius: 0.9rem; font-size: 0.87rem; line-height: 1.4; white-space: pre-wrap; }
  .ai-chat-msg.user { align-self: flex-end; background: var(--primary-grad); color: white; border-bottom-right-radius: 0.2rem; }
  .ai-chat-msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 0.2rem; }
  .ai-chat-input-row { display: flex; gap: 0.5rem; align-items: center; }
  .ai-chat-input-row input { margin: 0; }

  /* ---- header icon buttons ---- */
  .icon-wrap { position: relative; display: inline-flex; }
  .icon-btn { position: relative; width: 2.3rem; height: 2.3rem; border-radius: 50%; border: none; background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .icon-btn:hover { background: color-mix(in srgb, var(--primary) 22%, transparent); }
  .notif-dot { position: absolute; top: -2px; right: -2px; background: var(--danger); color: white; font-size: 0.65rem; font-weight: 700; min-width: 1.1rem; height: 1.1rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; padding: 0 0.25rem; box-shadow: 0 0 0 2px var(--primary); }

  /* ---- slide-in drawers (settings / notifications / profile) ---- */
  .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 190; opacity: 0; pointer-events: none; transition: opacity 0.28s ease; }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .side-drawer {
    position: fixed; top: 0; bottom: 0; width: min(320px, 86vw); z-index: 200;
    background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 0 46px rgba(0,0,0,0.35); padding: 1.1rem 1rem calc(1.1rem + env(safe-area-inset-bottom, 0px));
    overflow-y: auto; color: var(--text); transition: transform 0.32s cubic-bezier(.22,1,.36,1);
  }
  .side-drawer:not(.open) { pointer-events: none; }
  .side-drawer.right { right: 0; border-left: 1px solid var(--glass-border); transform: translateX(105%); }
  .side-drawer.right.open { transform: translateX(0); }
  .side-drawer.left { left: 0; border-right: 1px solid var(--glass-border); transform: translateX(-105%); }
  .side-drawer.left.open { transform: translateX(0); }
  .drawer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
  .drawer-header h4 { font-size: 1.05rem; }
  .drawer-subhead { font-size: 0.78rem; margin: 1.1rem 0 0.5rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .accordion-section { border-bottom: 1px solid var(--border); }
  .accordion-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; background: none; border: none; padding: 0.8rem 0.3rem; font-size: 0.9rem; font-weight: 600; color: var(--text); cursor: pointer; font-family: inherit; }
  .accordion-trigger:hover { color: var(--primary); }
  .accordion-chevron { transition: transform 0.25s ease; color: var(--text-muted); font-size: 0.78rem; }
  .accordion-section.open .accordion-chevron { transform: rotate(180deg); }
  .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.28s ease; padding: 0 0.2rem; }
  .accordion-section.open .accordion-body { max-height: 320px; padding-bottom: 0.7rem; }
  .drawer-close-btn { background: none; border: none; font-size: 1rem; color: var(--text-muted); cursor: pointer; width: 2rem; height: 2rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
  .drawer-close-btn:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); }
  .theme-option { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.7rem; border-radius: 0.7rem; cursor: pointer; font-size: 0.9rem; }
  .theme-option i { width: 1.1rem; text-align: center; color: var(--text-muted); }
  .theme-option:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); }
  .theme-option.active { background: color-mix(in srgb, var(--primary) 16%, transparent); font-weight: 600; }
  .theme-option.active i { color: var(--primary); }
  .notif-item { display: flex; align-items: flex-start; gap: 0.8rem; padding: 0.6rem 0.5rem; border-radius: 0.7rem; font-size: 0.88rem; color: var(--text); text-decoration: none; cursor: pointer; }
  .notif-item i { width: 2.1rem; height: 2.1rem; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; text-align: center; background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); border-radius: 0.65rem; font-size: 0.92rem; margin-top: 0.1rem; }
  .notif-item[style*="danger"] i { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .notif-item:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); }
  .notif-item.unread { background: color-mix(in srgb, var(--primary) 7%, transparent); }
  .notif-item.unread strong::after { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); margin-left: 0.4rem; vertical-align: middle; }
  .accent-swatches { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .accent-swatch { width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer; border: 2px solid transparent; position: relative; transition: transform 0.15s; flex-shrink: 0; }
  .accent-swatch:hover { transform: scale(1.1); }
  .accent-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--card); }
  .accent-swatch.active::after { content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.8rem; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }

  /* ---- flowing aurora behind the header (GPU-composited, two layers) ---- */
  header { position: sticky; overflow: visible; }
  header > * { position: relative; z-index: 1; }
  .header-aurora {
    position: absolute; left: -20%; right: -20%; top: -60%; height: 220%; pointer-events: none; z-index: 0;
    filter: blur(46px); opacity: 0.6; overflow: visible;
    background:
      radial-gradient(ellipse 38% 32% at 10% 40%, var(--primary) 0%, transparent 72%),
      radial-gradient(ellipse 38% 32% at 50% 18%, var(--primary-light) 0%, transparent 72%),
      radial-gradient(ellipse 38% 32% at 88% 46%, var(--primary) 0%, transparent 72%);
    background-size: 150% 150%;
    animation: auroraFlow 10s cubic-bezier(.45,.05,.55,.95) infinite alternate;
    will-change: transform;
  }
  .header-aurora::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 34% 26% at 22% 68%, var(--primary-light) 0%, transparent 74%),
      radial-gradient(ellipse 34% 26% at 70% 30%, var(--primary) 0%, transparent 74%);
    background-size: 150% 150%;
    mix-blend-mode: screen;
    animation: auroraFlow2 14s cubic-bezier(.45,.05,.55,.95) infinite alternate;
    animation-delay: -4s;
  }
  [data-theme="dark"] .header-aurora, [data-theme="black"] .header-aurora { opacity: 0.4; }
  @keyframes auroraFlow {
    0%   { transform: translate(0%, 0%) scale(1) rotate(0deg); }
    25%  { transform: translate(4%, -5%) scale(1.05) rotate(3deg); }
    50%  { transform: translate(-3%, 4%) scale(0.98) rotate(-3deg); }
    75%  { transform: translate(5%, 3%) scale(1.04) rotate(2deg); }
    100% { transform: translate(-4%, -3%) scale(1.02) rotate(-2deg); }
  }
  @keyframes auroraFlow2 {
    0%   { transform: translate(0%, 0%) scale(1) rotate(0deg); }
    40%  { transform: translate(-5%, 4%) scale(1.06) rotate(-4deg); }
    100% { transform: translate(4%, -3%) scale(0.97) rotate(3deg); }
  }
  @media (prefers-reduced-motion: reduce) { .header-aurora, .header-aurora::after { animation: none; } }

  /* ---- avatar / profile panel ---- */
  .avatar-circle { border-radius: 50%; background: var(--primary-grad); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .avatar-btn { width: 2.3rem; height: 2.3rem; font-size: 0.85rem; border: 2px solid var(--card); background: var(--primary-grad); padding: 0; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar-lg { width: 3rem; height: 3rem; font-size: 1.1rem; }
  .profile-panel-header { display: flex; align-items: center; gap: 0.7rem; padding: 0.3rem 0.4rem 1rem; }
  .avatar-edit-wrap { position: relative; flex-shrink: 0; }
  .avatar-edit-badge { position: absolute; bottom: -2px; right: -2px; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--primary); color: white; border: 2px solid var(--card); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; cursor: pointer; }
  .avatar-edit-badge:hover { filter: brightness(1.1); }

  /* ---- homepage: hero, categories, horizontal scroll sections ---- */
  .hero { position: relative; overflow: visible; padding: 1.8rem 0 0.6rem; margin-bottom: 0.6rem; }
  .hero-aurora { position: absolute; left: -15%; right: -15%; top: -60%; height: 220%; pointer-events: none; filter: blur(60px); opacity: 0.55;
    background:

  }

  .hero-content { position: relative; z-index: 1; max-width: 640px; }

  .hero-search { background: var(--glass-bg); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border: 1px solid var(--glass-border); border-radius: 0.9rem; padding: 0.7rem; box-shadow: var(--shadow-float); }
  .hero-search input { margin: 0; flex: 1; min-width: 180px; }
  .section-title { margin: 1.6rem 0 0.8rem; font-size: 1.15rem; }
  .cat-row { display: flex; gap: 0.9rem; overflow-x: auto; padding: 0.6rem 0.2rem 1rem; margin-bottom: 0.4rem; scrollbar-width: thin; scroll-snap-type: x proximity; scroll-behavior: smooth; }
  .cat-chip { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; background: var(--card); border: 1px solid var(--border); border-radius: 0.9rem; padding: 0.7rem 1rem; cursor: pointer; font-size: 0.78rem; color: var(--text); min-width: 76px; box-shadow: var(--shadow-float); scroll-snap-align: start; transition: border-color 0.15s, transform 0.2s ease, box-shadow 0.2s ease; }
  .cat-chip:hover { border-color: var(--primary); transform: translateY(-4px); }
  .cat-chip span { white-space: nowrap; }
  .cat-chip .cat-icon { font-size: 1.4rem; }
  .hscroll { display: flex; gap: 1rem; overflow-x: auto; padding: 0.6rem 0.2rem 1rem; scrollbar-width: thin; scroll-snap-type: x proximity; scroll-behavior: smooth; }
  .hscroll > * { flex: 0 0 250px; scroll-snap-align: start; }
  .hscroll .card, .hscroll .vendor-card { box-shadow: var(--shadow-float); transition: transform 0.2s ease, box-shadow 0.2s ease; }

  .vendor-card { background: var(--card); border: 1px solid var(--border); border-radius: 0.9rem; padding: 1rem; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }

  /* ---- product card favorite heart ---- */
  .product-card-wrap { position: relative; animation: cardLevitate 4.5s ease-in-out infinite; }

  .vendor-card { animation: cardLevitate 4.5s ease-in-out infinite; }

  .fav-btn { position: absolute; top: 0.6rem; right: 0.6rem; z-index: 2; width: 2rem; height: 2rem; border-radius: 50%; border: none; background: rgba(255,255,255,0.85); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.2); transition: transform 0.15s; }

  @media (max-width: 720px) { .toast-stack { bottom: calc(4.6rem + env(safe-area-inset-bottom, 0px)); } }

<body>
<header>
  <div class="header-aurora"></div>
  <div class="header-left">
    <div class="icon-wrap" id="profileWrap">
      <button class="icon-btn avatar-btn hidden" id="avatarBtn" onclick="toggleProfilePanel()" title="Profile"></button>
      <button class="icon-btn" id="loginBtn" onclick="showLogin()" title="Login / Register"><i class='fa-solid fa-user'></i></button>
    </div>
    <h1 onclick="navigate('home')"><img id="brandLogoHeader" class="brand-logo" alt="" /> Medris</h1>
  </div>
  <div class="header-right">
    <div class="icon-wrap hidden" id="notifWrap">
      <button class="icon-btn" onclick="toggleNotifPanel()" title="Notifications"><i class='fa-solid fa-bell'></i><span id="notifDot" class="notif-dot hidden">0</span></button>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn" onclick="toggleSettingsPanel()" title="Settings"><i class='fa-solid fa-gear'></i></button>
    </div>
  </div>
</header>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeAllPanels()"></div>
<div class="side-drawer right" id="notifPanel"></div>
<div class="side-drawer right" id="settingsPanel">
  <div class="drawer-header"><h4>Settings</h4><button class="drawer-close-btn" onclick="closeAllPanels()"><i class='fa-solid fa-xmark'></i></button></div>
  <div class="accordion-section">
    <button class="accordion-trigger" onclick="toggleAccordion(this)"><span><i class='fa-solid fa-palette'></i> Appearance</span><i class='fa-solid fa-chevron-down accordion-chevron'></i></button>
    <div class="accordion-body">
      <div class="theme-option" data-theme-choice="light" onclick="setTheme('light')"><i class='fa-solid fa-sun'></i> Light</div>
      <div class="theme-option" data-theme-choice="dark" onclick="setTheme('dark')"><i class='fa-solid fa-moon'></i> Dark</div>
      <div class="theme-option" data-theme-choice="black" onclick="setTheme('black')"><i class='fa-solid fa-circle'></i> Deep black</div>
    </div>
  </div>
  <div class="accordion-section">
    <button class="accordion-trigger" onclick="toggleAccordion(this)"><span><i class='fa-solid fa-fill-drip'></i> Accent color</span><i class='fa-solid fa-chevron-down accordion-chevron'></i></button>
    <div class="accordion-body">
      <div class="accent-swatches" id="accentSwatches"></div>
    </div>
  </div>
  <div class="theme-option" id="soundToggleOption" onclick="toggleSound()" style="margin-top:0.4rem;"></div>
</div>
<div class="side-drawer left" id="profilePanel"></div>

<div class="container" id="app"><p class="muted">Loading…</p></div>

<nav class="bottom-nav" id="bottomNav"></nav>

<!-- Login / Signup Modal -->
<div id="loginModal" class="modal hidden">
  <div class="modal-content">
    <img id="loginModalLogo" class="login-modal-logo" alt="Medris" />
    <h3 id="authModalTitle"><i class='fa-solid fa-right-to-bracket'></i> Welcome to Medris</h3>
    <div id="authError" class="error-text hidden"></div>

    <div id="signupExtraFields" class="hidden">
      <label>Full name</label>
      <input type="text" id="loginName" placeholder="Full name" />
      <label>I am a…</label>
      <select id="loginRole">
        <option value="buyer">Buyer (Student / Clinic / Health worker)</option>
        <option value="vendor">Vendor (Equipment owner)</option>
      </select>
      <label>City</label>
      <input type="text" id="loginCity" placeholder="City" value="Lagos" />
      <label>Phone</label>
      <input type="tel" id="loginPhone" placeholder="Phone" />
    </div>

    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="Email address" />
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Password (min 8 characters)" />

    <div class="flex" style="justify-content: space-between; margin-top: 0.8rem;">
      <button class="btn" id="authSubmitBtn" onclick="submitAuth()">Login</button>
      <button class="btn btn-sm" style="background:#6b7280;" onclick="hideLogin()">Cancel</button>
    </div>
    <p style="font-size:0.85rem;margin-top:0.8rem;">
      <a href="#" onclick="toggleAuthMode();return false;" id="authToggleLink">Need an account? Register</a>
    </p>
  </div>
</div>

<!-- Add/Edit Product Modal -->
<div id="productModal" class="modal hidden">
  <div class="modal-content" style="max-width:550px;">
    <h3 id="productModalTitle">Add New Product</h3>
    <div id="productError" class="error-text hidden"></div>
    <label>Product name</label>
    <input type="text" id="prodName" placeholder="e.g. BP Monitor" />
    <label>Description</label>
    <textarea id="prodDesc" placeholder="Description" rows="2"></textarea>
    <label>Category</label>
    <select id="prodCategory"><option value="">Uncategorized</option></select>
    <div class="flex">
      <div style="flex:1;">
        <label>Condition</label>
        <select id="prodCondition"><option value="new">New</option><option value="used-good" selected>Used - good</option><option value="used-fair">Used - fair</option></select>
      </div>
      <div style="flex:1;">
        <label>Listing type</label>
        <select id="prodListingType" onchange="updateProductFormFields()"><option value="rent">Rent only</option><option value="sale">Sale only</option><option value="both">Rent &amp; Sale</option></select>
      </div>
    </div>
    <div class="flex">
      <div style="flex:1;" id="prodSalePriceWrap"><label>Sale price (₦)</label><input type="number" id="prodSalePrice" step="0.01" /></div>
      <div style="flex:1;" id="prodRentalRateWrap"><label>Rental rate (₦)</label><input type="number" id="prodRentalRate" step="0.01" /></div>
    </div>
    <div id="prodRateUnitWrap"><label>Per</label><select id="prodRateUnit"><option value="day">Day</option><option value="week">Week</option></select></div>
    <div id="prodDepositWrap"><label>Refundable deposit (₦, optional)</label><input type="number" id="prodDeposit" step="0.01" /></div>
    <label>Quantity available</label>
    <input type="number" id="prodQtyTotal" value="1" min="1" />
    <div id="prodExistingPhotos" class="flex" style="margin:0.4rem 0;"></div>
    <label>Add photos</label>
    <input type="file" id="prodPhotoFiles" accept="image/*" multiple />
    <div class="flex" style="justify-content: flex-end; margin-top:0.8rem;">
      <button class="btn btn-sm" style="background:#6b7280;" onclick="closeProductModal()">Cancel</button>
      <button class="btn" id="saveProductBtn" onclick="saveProduct()">Save Product</button>
    </div>
  </div>
</div>

<!-- Confirm dialog (replaces native confirm()) -->
<div id="confirmModal" class="modal hidden">
  <div class="modal-content" style="max-width:380px;">
    <h3 id="confirmModalTitle">Please confirm</h3>
    <p id="confirmModalMsg" class="muted" style="margin:0.8rem 0 1.2rem;"></p>
    <div class="flex" style="justify-content:flex-end;">
      <button class="btn btn-sm" id="confirmModalCancel" style="background:#6b7280;">Cancel</button>
      <button class="btn btn-sm" id="confirmModalOk">Confirm</button>
    </div>
  </div>
</div>

<!-- Toast stack (replaces native alert()) -->
<div id="toastStack" class="toast-stack"></div>

<!-- Floating, draggable AI chat -->
<div id="aiChatFab" class="ai-chat-fab" title="Chat with Medris Assistant"><img id="aiChatFabLogo" class="ai-chat-fab-logo" alt="" /></div>
<div id="aiChatPanel" class="ai-chat-panel hidden">
  <div class="drawer-header"><h4><i class="fa-solid fa-robot"></i> Medris Assistant</h4><button class="drawer-close-btn" onclick="toggleAiChat()"><i class="fa-solid fa-xmark"></i></button></div>
  <div id="aiChatMessages" class="ai-chat-messages"></div>
  <div class="ai-chat-input-row">
    <input type="text" id="aiChatInput" placeholder="Ask about equipment, renting, buying…" onkeydown="if(event.key==='Enter')sendAiChatMessage();" />
    <button class="icon-btn" onclick="sendAiChatMessage()" title="Send"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>

// ---------- UTILS ----------
function naira(n) { return "₦" + Number(n ?? 0).toLocaleString(); }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function byId(id) { return document.getElementById(id); }

// ---------- SOUND EFFECTS ----------
let soundEnabled = true;
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(kind) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    const gain = ctx.createGain();
    gain.connect(ctx.destination);
    const freqMap = { click: [660], open: [520, 740], notify: [880, 1108], success: [660, 990], error: [220, 160] };
    const freqs = freqMap[kind] || [500];
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.1, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16 * freqs.length + 0.05);
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;
      osc.connect(gain);
      const start = now + i * 0.08;
      osc.start(start);
      osc.stop(start + 0.15);
    });
  } catch (e) { /* audio unsupported/blocked — fail silently */ }
}
function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem("medris-sound", soundEnabled ? "1" : "0");
  renderSoundToggle();
  if (soundEnabled) playSound("click");
}
function renderSoundToggle() {
  const el = byId("soundToggleOption");
  if (!el) return;
  el.innerHTML = `<i class='fa-solid ${soundEnabled ? "fa-volume-high" : "fa-volume-xmark"}'></i> Sound effects: ${soundEnabled ? "On" : "Off"}`;
}
function initSound() {
  soundEnabled = localStorage.getItem("medris-sound") !== "0";
  renderSoundToggle();
}
document.addEventListener("click", (e) => {
  if (e.target.closest(".btn, .icon-btn, .cat-chip, .theme-option, .accent-swatch, .bottom-nav-item, .fav-btn")) playSound("click");
}, true);

// ---------- TOASTS + CONFIRM DIALOG (replace native alert/confirm) ----------
function showToast(message, type = "info") {
  playSound(type === "error" ? "error" : "notify");
  const wrap = byId("toastStack");
  if (!wrap) { return; }
  const el = document.createElement("div");
  el.className = `toast toast-${type}`;
  const icon = type === "error" ? "fa-circle-exclamation" : type === "success" ? "fa-circle-check" : "fa-circle-info";
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${esc(message)}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 300);
  }, 4200);
}
function showConfirmDialog(message, opts = {}) {
  return new Promise((resolve) => {
    const modal = byId("confirmModal");
    byId("confirmModalTitle").textContent = opts.title || "Please confirm";
    byId("confirmModalMsg").textContent = message;
    const okBtn = byId("confirmModalOk");
    const cancelBtn = byId("confirmModalCancel");
    okBtn.textContent = opts.okLabel || "Confirm";
    okBtn.className = opts.danger ? "btn btn-danger" : "btn";
    modal.classList.remove("hidden");
    const cleanup = (result) => {
      modal.classList.add("hidden");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      resolve(result);
    };
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
  });
}

  { name: "Cyan", base: "#0e7490", light: "#06b6d4" },
];
let currentAccentIndex = 0;
function lightenHex(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r + (255 - r) * amt);
  g = Math.round(g + (255 - g) * amt);
  b = Math.round(b + (255 - b) * amt);
  return `#${[r, g, b].map((x) => x.toString(16).padStart(2, "0")).join("")}`;
}
function applyAccent(index) {
  const preset = ACCENT_PALETTE[index] || ACCENT_PALETTE[0];
  const theme = localStorage.getItem("medris-theme") || "light";
  const root = document.documentElement;
  if (theme === "light") {
    root.style.setProperty("--primary", preset.base);
    root.style.setProperty("--primary-light", preset.light);
    root.style.setProperty("--primary-grad", `linear-gradient(135deg, ${preset.base}, ${preset.light} 60%, ${lightenHex(preset.light, 0.25)})`);
  } else {
    const p1 = lightenHex(preset.light, 0.15);
    const p2 = lightenHex(preset.light, 0.55);
    root.style.setProperty("--primary", p1);
    root.style.setProperty("--primary-light", p2);
    root.style.setProperty("--primary-grad", `linear-gradient(135deg, ${preset.base}, ${p1} 60%, ${p2})`);
  }
}
function setAccent(index) {
  currentAccentIndex = index;
  localStorage.setItem("medris-accent", String(index));
  applyAccent(index);
  renderAccentSwatches();

function renderAccentSwatches() {

}

}

function setupDrawerSwipe(drawer, side) {
  let startX = null, dx = 0, dragging = false;
  drawer.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    dragging = true;
    drawer.style.transition = "none";
  }, { passive: true });
  drawer.addEventListener("touchmove", (e) => {
    if (!dragging || startX === null) return;
    const delta = e.touches[0].clientX - startX;
    const closingDir = side === "right" ? delta > 0 : delta < 0;
    dx = closingDir ? delta : 0;
    drawer.style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  drawer.addEventListener("touchend", () => {
    dragging = false;
    startX = null;
    drawer.style.transition = "";
    drawer.style.transform = "";
    if (Math.abs(dx) > 70) closeAllPanels();
    dx = 0;
  }, { passive: true });
}
["notifPanel", "settingsPanel"].forEach((id) => setupDrawerSwipe(byId(id), "right"));
setupDrawerSwipe(byId("profilePanel"), "left");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAllPanels(); });

// Swipe to OPEN, from anywhere on screen (not just the edges): swipe
// left-to-right opens the profile drawer, right-to-left opens
// notifications. The outermost sliver of each edge is deliberately left
// alone so it doesn't fight the phone's own OS back-gesture, and touches
// starting inside scrollable rails, form controls, or modals are ignored
// so this never hijacks a carousel swipe or a text selection.
(function setupSwipeGestures() {
  const OS_EDGE_EXCLUDE = 20, THRESHOLD = 70;
  let startX = null, startY = null, active = false;
  function isExempt(el) {
    return !!el.closest(".hscroll, .cat-row, input, textarea, select, button, a, .side-drawer, .modal, .bottom-nav");
  }
  document.addEventListener("touchstart", (e) => {
    if (document.querySelector(".side-drawer.open")) { active = false; return; }
    const t = e.touches[0];
    if (t.clientX <= OS_EDGE_EXCLUDE || t.clientX >= window.innerWidth - OS_EDGE_EXCLUDE) { active = false; return; }
    if (isExempt(e.target)) { active = false; return; }
    startX = t.clientX; startY = t.clientY; active = true;
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (!active || startX === null) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = Math.abs(t.clientY - startY);
    if (dy > 50) { active = false; return; }
    if (dx > THRESHOLD) {
      if (!byId("avatarBtn").classList.contains("hidden")) openDrawer("profilePanel");
      active = false;
    } else if (dx < -THRESHOLD) {
      if (!byId("notifWrap").classList.contains("hidden")) toggleNotifPanel();
      active = false;
    }
  }, { passive: true });
  document.addEventListener("touchend", () => { active = false; startX = null; startY = null; });
})();

let notifChannel = null;
function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

async function refreshNotifications() {
  notifCount = 0;
  const notifWrap = byId("notifWrap");
  if (!session || !profile) { notifWrap?.classList.add("hidden"); return; }
  notifWrap?.classList.remove("hidden");

  const { data: items } = await sb.from("notifications").select("*").eq("user_id", session.user.id).order("created_at", { ascending: false }).limit(30);
  const unreadCount = (items || []).filter((n) => !n.read).length;
  notifCount = unreadCount;

  const dot = byId("notifDot");
  if (dot) {
    if (unreadCount > 0) { dot.textContent = unreadCount > 9 ? "9+" : unreadCount; dot.classList.remove("hidden"); }
    else dot.classList.add("hidden");
  }

  const panel = byId("notifPanel");
  if (panel) {
    const header = `<div class="drawer-header"><h4>Notifications</h4><button class="drawer-close-btn" onclick="closeAllPanels()"><i class='fa-solid fa-xmark'></i></button></div>`;
    panel.innerHTML = header + ((items && items.length)
      ? items.map((n) => `<a class="notif-item ${n.read ? "" : "unread"}" onclick='closeAllPanels();navigate(${JSON.stringify(n.target_view || "home")}, ${JSON.stringify(n.target_params || {})});'>
          ${n.actor_avatar_url ? `<img src="${esc(n.actor_avatar_url)}" class="avatar-circle" style="width:2.1rem;height:2.1rem;object-fit:cover;" />` : n.actor_name ? `<span class="avatar-circle" style="width:2.1rem;height:2.1rem;font-size:0.8rem;">${esc(initials(n.actor_name))}</span>` : `<i class='fa-solid fa-circle-info'></i>`}
          <span><strong style="display:block;">${esc(n.title)}</strong>${n.body ? `<span class="muted" style="font-size:0.8rem;">${esc(n.body)}</span><br/>` : ""}<span class="muted" style="font-size:0.72rem;">${timeAgo(n.created_at)}</span></span>
        </a>`).join("")
      : `<p class="muted" style="padding:0.4rem;">You're all caught up.</p>`);
  }
}

async function markNotificationsRead() {
  if (!session) return;
  byId("notifDot")?.classList.add("hidden");
  document.querySelectorAll("#notifPanel .notif-item.unread").forEach((el) => el.classList.remove("unread"));
  await sb.from("notifications").update({ read: true }).eq("user_id", session.user.id).eq("read", false);
}

function subscribeNotifications() {
  if (notifChannel) { sb.removeChannel(notifChannel); notifChannel = null; }
  if (!session) return;
  notifChannel = sb.channel(`notifications-${session.user.id}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: `user_id=eq.${session.user.id}` }, (payload) => {
      playSound("notify");
      showToast(payload.new.title, "info");
      refreshNotifications();
    })
    .subscribe();
}

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file || !session) return;
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${session.user.id}/avatar.${ext}`;
  const { error: upErr } = await sb.storage.from("avatars").upload(path, file, { upsert: true, contentType: file.type });
  if (upErr) { showToast(upErr.message, "error"); return; }
  const { data: pub } = sb.storage.from("avatars").getPublicUrl(path);
  const url = `${pub.publicUrl}?t=${Date.now()}`;
  const { error } = await sb.from("users").update({ avatar_url: url }).eq("id", session.user.id);
  if (error) { showToast(error.message, "error"); return; }
  profile.avatar_url = url;
  updateAuthUI();
  showToast("Profile photo updated.", "success");
}

function showLogin() { authMode = "login"; applyAuthMode(); byId("loginModal").classList.remove("hidden"); }
function hideLogin() { byId("loginModal").classList.add("hidden"); byId("authError").classList.add("hidden"); }
function toggleAuthMode() { authMode = authMode === "login" ? "register" : "login"; applyAuthMode(); }
function applyAuthMode() {
  const isRegister = authMode === "register";
  byId("authModalTitle").innerHTML = isRegister ? "<i class='fa-solid fa-user-plus'></i> Create your Medris account" : "<i class='fa-solid fa-right-to-bracket'></i> Welcome back to Medris";
  byId("signupExtraFields").classList.toggle("hidden", !isRegister);
  byId("authSubmitBtn").textContent = isRegister ? "Create account" : "Login";
  byId("authToggleLink").textContent = isRegister ? "Already have an account? Login" : "Need an account? Register";

async function submitAuth() {
  const email = byId("loginEmail").value.trim();
  const password = byId("loginPassword").value;
  const errorEl = byId("authError");
  errorEl.classList.add("hidden");
  if (!email || !password) { errorEl.textContent = "Email and password are required."; errorEl.classList.remove("hidden"); return; }

  const btn = byId("authSubmitBtn");
  btn.disabled = true;

  try {
    if (authMode === "register") {
      const name = byId("loginName").value.trim();
      const role = byId("loginRole").value;
      const city = byId("loginCity").value.trim();
      const phone = byId("loginPhone").value.trim();
      if (!name) throw new Error("Full name is required.");
      if (password.length < 8) throw new Error("Password must be at least 8 characters.");

      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { name, phone, city, role } },
      });
      if (error) throw error;

      if (!data.session) {
        hideLogin();
        showToast("Check your email for a confirmation link, then log in.", "success");
        return;
      }
      await refreshAuthStateOnce();
      hideLogin();
      navigate(role === "vendor" ? "vendorApply" : "home");
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await refreshAuthStateOnce();
      hideLogin();
      navigate("home");
    }
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove("hidden");
  } finally {
    btn.disabled = false;
  }
}

async function logout() {
  await sb.auth.signOut();
  await refreshAuthStateOnce();
  navigate("home");
}

// ---------- NAVIGATION ----------
async function navigate(view, params = {}, pushHistory = true) {
  const app = byId("app");
  app.innerHTML = '<p class="muted">Loading…</p>';
  updateAuthUI();
  if (pushHistory) history.pushState({ view, params }, "", location.pathname + location.search);
  try {
    switch (view) {
      case "home": app.innerHTML = await renderHome(); break;
      case "productDetail": app.innerHTML = await renderProductDetail(params.productId); break;
      case "storefront": app.innerHTML = await renderStorefront(params.vendorId); break;
      case "vendorApply": app.innerHTML = await renderVendorApply(); break;
      case "vendorDashboard": app.innerHTML = await renderVendorDashboard(); break;
      case "vendorEditProfile": app.innerHTML = await renderVendorEditProfile(); break;
      case "vendorProducts": app.innerHTML = await renderVendorProducts(); break;
      case "vendorOrders": app.innerHTML = await renderVendorOrders(params.status); break;
      case "buyerOrders": app.innerHTML = await renderBuyerOrders(); break;
      case "orderDetail": app.innerHTML = await renderOrderDetail(params.orderId); break;
      case "adminPanel": app.innerHTML = await renderAdminPanel(params.status); break;
      case "adminDisputes": app.innerHTML = await renderAdminDisputes(); break;
      case "adminUsers": app.innerHTML = await renderAdminUsers(); break;
      case "adminFinance": app.innerHTML = await renderAdminFinance(); break;
      case "wishlist": app.innerHTML = await renderWishlist(); break;
      case "requestEquipment": app.innerHTML = await renderRequestEquipment(); break;
      case "vendorRequests": app.innerHTML = await renderVendorRequests(); break;
      default: app.innerHTML = await renderHome();
    }
  } catch (err) {
    app.innerHTML = `<div class="empty-state">Something went wrong: ${esc(err.message)}</div>`;
  }
  clearAutoScrollTimers();

// ---------- AUTO-SLIDING CAROUSELS (category row + horizontal product/vendor rails) ----------
let autoScrollTimers = [];
function clearAutoScrollTimers() {
  autoScrollTimers.forEach(clearInterval);
  autoScrollTimers = [];
}
function setupAutoScroll(container, { interval = 3200, pauseAfterInteraction = 8000 } = {}) {
  if (!container) return;
  let paused = false;
  let pauseTimeout = null;
  const pause = () => {
    paused = true;
    clearTimeout(pauseTimeout);
    pauseTimeout = setTimeout(() => { paused = false; }, pauseAfterInteraction);
  };
  container.addEventListener("touchstart", pause, { passive: true });
  container.addEventListener("wheel", pause, { passive: true });
  container.addEventListener("mousedown", pause);
  const timer = setInterval(() => {
    if (paused || !container.isConnected) return;
    const maxScroll = container.scrollWidth - container.clientWidth;
    if (maxScroll <= 4) return;
    const step = Math.max(container.clientWidth * 0.85, 200);
    let next = container.scrollLeft + step;
    if (next >= maxScroll - 2) next = 0; // reached the end — slide back to the start
    container.scrollTo({ left: next, behavior: "smooth" });
  }, interval);
  autoScrollTimers.push(timer);
}

function scrollToBrowse(listingType) {
  const sel = byId("filterListing");
  if (sel) { sel.value = listingType; filterHomeProducts(); }
  byId("browseSection")?.scrollIntoView({ behavior: "smooth", block: "start" });
}
function filterByCategory(catId) {
  const sel = byId("filterCategory");
  if (sel) { sel.value = catId; filterHomeProducts(); }
  byId("browseSection")?.scrollIntoView({ behavior: "smooth", block: "start" });
}
function syncHeroSearch() {
  const val = byId("heroSearch").value;
  const target = byId("searchInput");
  if (target) { target.value = val; filterHomeProducts(); }
  if (val) byId("browseSection")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function filterHomeProducts() {
  const search = byId("searchInput")?.value.trim() || "";
  const listing = byId("filterListing")?.value || "";
  const catId = byId("filterCategory")?.value || "";

  let query = sb
    .from("products")
    .select("id, name, listing_type, sale_price, rental_rate, rental_rate_unit, photos, quantity_available, condition, vendor:vendors!inner(id, business_name, verification_status)")
    .eq("status", "active")
    .eq("vendor.verification_status", "verified");

  if (search) query = query.ilike("name", `%${search}%`);
  if (listing === "rent") query = query.in("listing_type", ["rent", "both"]);
  if (listing === "sale") query = query.in("listing_type", ["sale", "both"]);
  if (catId) query = query.eq("category_id", catId);

  const { data: products, error } = await query.order("created_at", { ascending: false });
  const grid = byId("productGrid");
  if (!grid) return;
  if (error || !products || products.length === 0) {
    grid.innerHTML = `<div class="empty-state">No products found. Vendors, start listing!</div>`;
    return;
  }
  grid.innerHTML = products.map(productCardHtml).join("");
}

async function toggleFavorite(evt, productId) {
  evt.stopPropagation();
  if (!session) { showLogin(); return; }
  const btn = evt.currentTarget;
  const isFav = favoriteIds.has(productId);
  if (isFav) {
    await sb.from("favorites").delete().eq("buyer_id", session.user.id).eq("product_id", productId);
    favoriteIds.delete(productId);
    btn.innerHTML = "<i class='fa-regular fa-heart'></i>"; btn.classList.remove("active");
  } else {
    const { error } = await sb.from("favorites").insert({ buyer_id: session.user.id, product_id: productId });
    if (error) return;
    favoriteIds.add(productId);
    btn.innerHTML = "<i class='fa-solid fa-heart'></i>"; btn.classList.add("active");
  }
}

async function confirmRental(vendorId, productId) {
  if (!session) { showLogin(); return; }
  const start = byId("rentStart").value;
  const end = byId("rentEnd").value;
  const qty = parseInt(byId("rentQty").value) || 1;
  const errorEl = byId("rentError");
  errorEl.classList.add("hidden");
  if (!start || !end) { errorEl.textContent = "Select both dates."; errorEl.classList.remove("hidden"); return; }

  const { data: orderId, error } = await sb.rpc("create_rental_order", {
    p_vendor_id: vendorId,
    p_product_id: productId,
    p_quantity: qty,
    p_start_date: start,
    p_end_date: end,
    p_delivery_method: "pickup",
    p_delivery_address: "",
  });
  if (error) { errorEl.textContent = error.message; errorEl.classList.remove("hidden"); return; }
  navigate("orderDetail", { orderId });
}

async function buyNow(vendorId, productId) {
  if (!session) { showLogin(); return; }
  const qty = parseInt(byId("buyQty").value) || 1;
  const errorEl = byId("buyError");
  errorEl.classList.add("hidden");

  const { data: orderId, error } = await sb.rpc("create_sale_order", {
    p_vendor_id: vendorId,
    p_product_id: productId,
    p_quantity: qty,
    p_delivery_method: "pickup",
    p_delivery_address: "",
  });
  if (error) { errorEl.textContent = error.message; errorEl.classList.remove("hidden"); return; }
  navigate("orderDetail", { orderId });
}

async function submitVendorApply() {
  const errorEl = byId("vendorApplyError");
  errorEl.classList.add("hidden");
  const business_name = byId("vaBusinessName").value.trim();
  const address = byId("vaAddress").value.trim();
  const phone = byId("vaPhone").value.trim();
  if (!business_name || !phone) {
    errorEl.textContent = "Business name and phone are required.";
    errorEl.classList.remove("hidden");
    return;
  }

  try {
    let verification_docs = [];
    const file = byId("vaDoc").files[0];
    if (file) {
      const ext = file.name.split(".").pop() || "bin";
      const path = `${session.user.id}/${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from("vendor-docs").upload(path, file, { contentType: file.type });
      if (upErr) throw new Error(`Document upload failed: ${upErr.message}`);
      verification_docs = [path];
    }

    const { error } = await sb.from("vendors").insert({
      user_id: session.user.id,
      business_name,
      address: address || null,
      city: byId("vaCity").value.trim() || null,
      phone,
      whatsapp_number: byId("vaWhatsapp").value.trim() || null,
      cac_number: byId("vaCac").value.trim() || null,
      bio: byId("vaBio").value.trim() || null,
      verification_docs,
    });
    if (error) throw new Error(error.message);

    await refreshAuthState();
    navigate("vendorDashboard");
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove("hidden");
  }
}

async function renderVendorDashboard() {
  if (!session || (profile?.role !== "vendor" && !vendor)) return '<div class="empty-state">Access denied.</div>';
  const { data: v } = await sb.from("vendors").select("*").eq("user_id", session.user.id).maybeSingle();
  if (!v) { navigate("vendorApply"); return '<p class="muted">Redirecting…</p>'; }
  vendor = v;

  let statusBanner = "";
  if (v.verification_status === "pending") statusBanner = `<div class="banner banner-warning"><strong><i class='fa-solid fa-hourglass-half'></i> Verification pending.</strong> Your shop is under review — once approved you can list products.</div>`;
  else if (v.verification_status === "rejected") statusBanner = `<div class="banner banner-danger"><strong>Application not approved.</strong> Contact support if this seems wrong.</div>`;
  else if (!v.is_active) statusBanner = `<div class="banner banner-muted"><strong><i class='fa-solid fa-pause'></i> Storefront paused.</strong> Buyers can't see your shop or products right now.</div>`;
  else statusBanner = `<div class="banner banner-success"><strong><i class='fa-solid fa-circle-check'></i> Verified.</strong> Your storefront: <a href="#" onclick="navigate('storefront',{vendorId:'${v.id}'});return false;">view it</a>.</div>`;

  const [{ data: orders }, { data: products }] = await Promise.all([
    sb.from("orders").select("status, total_amount").eq("vendor_id", v.id),
    sb.from("products").select("id, view_count").eq("vendor_id", v.id),
  ]);
  const totalOrders = orders?.length ?? 0;
  const revenue = orders?.filter((o) => o.status === "completed").reduce((s, o) => s + o.total_amount, 0) ?? 0;
  const totalViews = (products || []).reduce((s, p) => s + (p.view_count || 0), 0);
  const favCounts = await Promise.all((products || []).map((p) => sb.rpc("get_favorite_count", { p_product_id: p.id })));
  const totalFavorites = favCounts.reduce((s, r) => s + (r?.data ?? 0), 0);

  let html = `<div class="flex" style="justify-content:space-between;"><h2><i class='fa-solid fa-box'></i> ${esc(v.business_name)}</h2>
    <div class="flex">
      <button class="btn btn-sm" onclick="navigate('vendorProducts')">Products</button>
      <button class="btn btn-sm" onclick="navigate('vendorOrders',{status:'all'})">Orders</button>
      <button class="btn btn-sm" onclick="navigate('vendorRequests')"><i class='fa-solid fa-clipboard-list'></i> Buyer requests</button>
      <button class="btn btn-sm btn-outline" onclick="navigate('vendorEditProfile')"><i class='fa-solid fa-pen'></i> Edit profile</button>
      ${v.verification_status === "verified" ? `<button class="btn btn-sm btn-outline" onclick="toggleVendorActive(${v.is_active})">${v.is_active ? "<i class='fa-solid fa-pause'></i> Pause storefront" : "<i class='fa-solid fa-play'></i> Reactivate storefront"}</button>` : ""}
    </div></div>`;
  html += statusBanner;
  html += `<div class="grid" style="grid-template-columns:repeat(4,1fr);max-width:700px;">
    <div class="stat"><div class="n">${totalOrders}</div><div class="muted">Total orders</div></div>
    <div class="stat"><div class="n">${naira(revenue)}</div><div class="muted">Revenue (completed)</div></div>
    <div class="stat"><div class="n">${totalViews}</div><div class="muted">Product views</div></div>
    <div class="stat"><div class="n">${totalFavorites}</div><div class="muted">Wishlist saves</div></div>
  </div>`;
  return html;
}

}

async function saveVendorBankDetails() {
  const errorEl = byId("bankError");
  errorEl.classList.add("hidden");
  const bankCode = byId("veBankCode").value;
  const accountNumber = byId("veAccountNumber").value.trim();
  if (!/^\d{10}$/.test(accountNumber)) {
    errorEl.textContent = "Enter a valid 10-digit account number.";
    errorEl.classList.remove("hidden");
    return;
  }
  const btn = byId("saveBankBtn");
  btn.disabled = true;
  try {
    const res = await fetch("/api/create-subaccount", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accessToken: session.access_token, bankCode, accountNumber }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || "Could not save payout details.");
    showToast(`Payouts set up for ${json.account_name}.`, "success");
    navigate("vendorEditProfile");
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove("hidden");
    btn.disabled = false;
